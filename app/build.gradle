plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wenzigongju'
    compileSdk 34

    // ---- 本机临时签名（沙盒构建用，证书随项目归档）----
    // 说明：同一枚证书的后续版本可直接覆盖安装；换证书必须卸载重装。
    signingConfigs {
        localSign {
            storeFile file("../keystore/wenzi.jks")
            storePassword "wenzi2026"
            keyAlias "wenzi"
            keyPassword "wenzi2026"
        }
    }

    defaultConfig {
        applicationId "com.wenzigongju"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.localSign
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding false
    }

    // 固定构建工具版本（AGP 8.1.4 默认要 33.0.1，这里统一到已安装的 34.0.0）
    buildToolsVersion "34.0.0"
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
}
