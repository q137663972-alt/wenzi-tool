<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文字工具</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="app">
  <header class="hero">
    <h1>文字工具 <span class="badge">军师</span></h1>
    <p class="sub">贴进聊天记录，直接给你能发出去的话。</p>
  </header>

  <div class="disclaimer">
    ⚠️ 生成的是<strong>草稿话术</strong>，发之前自己过一眼。对话与档案只存本地。
  </div>

  <section class="input-card">
    <label>🎯 她最后说的那句 <span class="hint">（要接着回的那句，必填）</span></label>
    <textarea id="message" rows="2" placeholder="她回了句「哈哈」就没下文了…"></textarea>

    <div class="shot-zone" id="shotZone">
      <div class="shot-inner">
        <div class="shot-icon">🖼️</div>
        <div class="shot-title">贴聊天截图，自动还原对话</div>
        <div class="shot-sub">点这里选图，或直接把截图拖进来 / Ctrl+V 粘贴</div>
      </div>
      <input type="file" id="shotFile" accept="image/*" multiple hidden>
    </div>
    <div id="shotList" class="shot-list"></div>
    <div id="shotStatus" class="shot-status"></div>

    <div class="dual-win">
      <div class="dual-col col-her">
        <div class="dual-head">◀ 她说的</div>
        <textarea id="herLog" rows="5" placeholder="微信里长按她的气泡逐条复制，粘这&#10;一句一行，不用带名字"></textarea>
        <button class="dual-add" data-side="her">＋ 加一句</button>
      </div>
      <div class="dual-col col-me">
        <div class="dual-head">我说的 ▶</div>
        <textarea id="meLog" rows="5" placeholder="你回的话粘这&#10;一句一行，不用带名字"></textarea>
        <button class="dual-add" data-side="me">＋ 加一句</button>
      </div>
    </div>
    <div class="dual-tip">
      💡 两个窗按<strong>时间顺序各记各的</strong>，不用管谁先谁后；我会自动按上下文排序。
      也可以在下面直接贴整段（带「我：」「她：」那种）。
    </div>

    <label>📋 或者：粘贴整段聊天记录 <span class="hint">（可选）</span></label>
    <textarea id="chatlog" rows="3" placeholder="有整段就直接粘。会自动认出哪句是你、哪句是她。"></textarea>

    <div id="chatWin" class="chat-win" style="display:none">
      <div class="chat-head">
        <span class="chat-side-label left">◀ 她说的</span>
        <span class="chat-side-label right">我说的 ▶</span>
      </div>
      <div id="chatList" class="chat-list"></div>
      <div class="parse-tip">顺序错了？用每条旁的 ▲▼ 调整先后；点气泡可左右翻转改归属。改完直接点「给话术」。</div>
    </div>

    <div class="row">
      <div class="field">
        <label>她在你手机里的称呼</label>
        <input id="herName" placeholder="可留空，默认「她」">
      </div>
      <div class="field">
        <label>关系阶段（可留空自动判断）</label>
        <select id="stage">
          <option value="">自动判断</option>
          <option>A 吸引（刚认识/刚加微信）</option>
          <option>C 舒适（聊得来/有信任）</option>
          <option>S 诱惑（氛围到了/该推进）</option>
        </select>
      </div>
    </div>

    <div id="stageConfirmed" class="stage-confirmed"></div>
    <div id="stageCard" class="stage-card" style="display:none">
      <div id="stageGuess" class="stage-guess"></div>
      <div id="stageReason" class="stage-reason"></div>
    </div>
    <div id="stageStatus" class="stage-status"></div>

    <div class="row">
      <div class="field">
        <label>你的目标</label>
        <select id="goal">
          <option value="">不确定</option>
          <option>脱单</option>
          <option>暧昧升温</option>
          <option>约出来</option>
          <option>挽回 / 复联</option>
          <option>单纯参谋</option>
        </select>
      </div>
      <div class="field">
        <label>🤖 模型</label>
        <select id="model"><option value="auto">自动（推荐）</option></select>
      </div>
    </div>

    <div class="style-row">
      <label class="switch"><input type="checkbox" id="useStyle" checked>
        🗣️ 用我本人的语气写（嘴硬心软那套）</label>
    </div>

    <button id="go">给话术 🔥</button>
  </section>

  <div class="stream-head"><span>💬 历史（连续记忆）</span><button id="clear" class="mini">清空</button></div>
  <section id="stream" class="result"></section>

  <section class="ver-bar" id="verBar">
    <span class="ver-i">ℹ️</span>
    <span class="ver-text">APK <b id="verApk">…</b> · H5 <b id="verH5">…</b></span>
    <span id="verState" class="ver-state">启动中…</span>
    <button id="verCheck" class="mini">检查更新</button>
    <button id="verApply" class="mini ver-apply" style="display:none">立即应用</button>
  </section>

  <footer>只给话术，不替你决定人生。真诚最省事。</footer>
</div>
<script src="./js/prompts.js"></script>
<script src="./js/chatparse.js"></script>
<script src="./js/shotparse.js"></script>
<script src="./js/offline.js"></script>
<script src="./js/update.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
